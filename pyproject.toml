[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novelflow-ai"
version = "0.1.0"
description = "Universal AI web-fiction production workflow: idea to cover to completion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
export = ["python-docx>=1.1", "EbookLib>=0.18", "reportlab>=4.0"]
dev = ["pytest>=8"]

[project.scripts]
novelflow = "novelflow.cli:main"
novelflow-mcp = "novelflow.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["novelflow*"]
